[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-public-officer-crawler"
version = "1.0.0"
description = "Reusable crawler for public Bangladesh government officer tables"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "pdfplumber>=0.11,<0.12", "truststore>=0.10,<1"]

[tool.setuptools.packages.find]
include = ["officer_crawler*"]
