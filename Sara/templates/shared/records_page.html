{% extends "shared/page.html" %}{% block page_content %}
<form method="get" class="ui-filters">
<label class="ui-field">খুঁজুন / Search<input name="search" value="{{ request.GET.search }}" maxlength="100"></label>
{% if request_filters %}<label class="ui-field">জেলা / District<select name="district"><option value="">সব / All</option>{% for code, district in geography.items %}<option value="{{ code }}" {% if request.GET.district == code %}selected{% endif %}>{{ district.name }}</option>{% endfor %}</select></label>
<label class="ui-field">সহায়তা / Need<select name="need"><option value="">সব / All</option><option value="food">খাদ্য / Food</option><option value="water">পানি / Water</option><option value="medicine">ওষুধ / Medicine</option><option value="rescue">উদ্ধার / Rescue</option><option value="shelter">আশ্রয় / Shelter</option></select></label>
<label class="ui-field">অবস্থা / Status<select name="status"><option value="">সব / All</option><option value="pending">অপেক্ষমাণ / Pending</option><option value="clarification_needed">ব্যাখ্যা প্রয়োজন / Clarification</option><option value="assigned">নির্ধারিত / Assigned</option><option value="completed">সম্পন্ন / Completed</option><option value="rejected">প্রত্যাখ্যাত / Rejected</option></select></label><label class="ui-field">অগ্রাধিকার / Priority<select name="priority"><option value="">সব / All</option><option value="critical">জরুরি / Critical</option><option value="high">উচ্চ / High</option><option value="normal">সাধারণ / Normal</option></select></label>{% endif %}
{% if mission_filters %}<label class="ui-field">অবস্থা / State<select name="state"><option value="">সব / All</option><option value="active">সক্রিয় / Active</option><option value="history">ইতিহাস / History</option></select></label><label class="ui-field">দায়িত্ব / Target<select name="target"><option value="">সব / All</option><option value="individual">ব্যক্তি / Individual</option><option value="team">দল / Team</option></select></label>{% endif %}
<button type="submit" class="ui-button"><span data-en="Filter">বাছাই করুন</span></button></form>
{% for record in records %}{% include "shared/record.html" %}{% empty %}<section class="ui-card ui-empty"><h2 data-en="No matching records">মিল পাওয়া যায়নি</h2><p data-en="Change the filters or return later.">বাছাই পরিবর্তন করুন অথবা পরে দেখুন।</p></section>{% endfor %}
{% endblock %}
