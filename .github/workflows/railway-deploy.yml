name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and LFS files
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.1

      - name: Verify Git LFS files
        run: python scripts/check_railway_assets.py

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "Set the RAILWAY_TOKEN secret and RAILWAY_SERVICE repository variable."
            exit 1
          fi
          railway up --service "$RAILWAY_SERVICE" --ci
